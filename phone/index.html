<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>buddy</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0d14; overflow: hidden; touch-action: manipulation; }
  #scene { position: fixed; inset: 0; }
  #bubble {
    position: fixed; display: none; max-width: 72vw;
    background: #1a1a24; color: #e8e8f0; border: 2px solid #4fd06a;
    border-radius: 10px; padding: 10px 14px;
    font: 15px/1.35 ui-monospace, Menlo, monospace;
    transform: translateX(-50%); z-index: 2; word-wrap: break-word;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px;
    border: 6px solid transparent; border-top-color: #4fd06a; border-bottom: 0;
  }
  #status {
    position: fixed; top: env(safe-area-inset-top, 8px); right: 10px;
    width: 8px; height: 8px; border-radius: 50%; background: #7a1f2b; z-index: 3;
  }
  #status.on { background: #379850; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="bubble"></div>
<div id="status"></div>
<script>
window.onerror = (msg, src, line, col) => console.log("[buddy] ERROR", msg, line + ":" + col);
(async () => {
  const qs = new URLSearchParams(location.search);
  const topic = qs.get("topic") || "buddy-0863324718e2";
  const sprites = await (await fetch("sprites.json")).json();
  const palette = sprites.palette, anims = sprites.anims;

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const bubbleEl = document.getElementById("bubble");
  const statusEl = document.getElementById("status");
  let W, H, SCALE, FLOOR;
  function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    SCALE = Math.max(4, Math.floor(Math.min(W, H) / 55));
    FLOOR = H - SCALE * 16 - Math.floor(H * 0.08);
  }
  resize();
  addEventListener("resize", resize);

  // Frame cache: one offscreen canvas per (anim, index, flip).
  const cache = new Map();
  function frameCanvas(animName, idx, flip) {
    const key = animName + ":" + idx + ":" + flip;
    if (cache.has(key)) return cache.get(key);
    const rows = anims[animName].frames[idx];
    const c = document.createElement("canvas");
    c.width = rows[0].length * SCALE;
    c.height = rows.length * SCALE;
    const g = c.getContext("2d");
    rows.forEach((row, y) => {
      const chars = flip ? [...row].reverse() : [...row];
      chars.forEach((ch, x) => {
        const col = palette[ch];
        if (!col || col === "transparent") return;
        g.fillStyle = col;
        g.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
      });
    });
    cache.set(key, c);
    return c;
  }

  const buddy = {
    present: false, x: 0, y: 0, flip: false,
    anim: "idle", frame: 0, lastFrame: 0,
    target: null, onArrive: null, oneShotDone: null,
  };
  function setAnim(name, done) {
    if (!anims[name]) name = "idle";
    buddy.anim = name; buddy.frame = 0; buddy.lastFrame = 0;
    buddy.oneShotDone = done || null;
  }
  function say(text, secs) {
    bubbleEl.textContent = text;
    bubbleEl.style.display = "block";
    positionBubble();
    clearTimeout(say.t);
    say.t = setTimeout(() => { bubbleEl.style.display = "none"; }, (secs || 8) * 1000);
  }
  function positionBubble() {
    if (bubbleEl.style.display === "none") return;
    const px = buddy.x / devicePixelRatio + (16 * SCALE) / devicePixelRatio / 2;
    const py = buddy.y / devicePixelRatio;
    bubbleEl.style.left = Math.max(bubbleEl.offsetWidth / 2 + 6, Math.min(innerWidth - bubbleEl.offsetWidth / 2 - 6, px)) + "px";
    bubbleEl.style.top = Math.max(6, py - bubbleEl.offsetHeight - 14) + "px";
  }

  function arrive(message) {
    buddy.present = true;
    buddy.x = W / 2 - 8 * SCALE;
    buddy.y = FLOOR;
    const entrance = anims.portalout ? "portalout" : "walk.in";
    setAnim(entrance, () => {
      setAnim("excited");
      say(message, 10);
      setTimeout(() => { if (buddy.anim === "excited") setAnim("idle"); }, 2500);
    });
  }

  function walkTo(x) {
    buddy.target = x;
    buddy.flip = x < buddy.x;
    setAnim("walk");
  }

  // Idle life: occasional wander along the floor.
  setInterval(() => {
    if (!buddy.present || buddy.anim !== "idle" || Math.random() < 0.5) return;
    walkTo(Math.random() * (W - 20 * SCALE) + 2 * SCALE);
  }, 7000);

  const pokes = ["hey. i live here now", "pocket-sized and thriving", "your phone is warm. suspicious", "poke registered. filing grievance"];
  addEventListener("pointerdown", (e) => {
    if (!buddy.present) return;
    const px = e.clientX * devicePixelRatio, py = e.clientY * devicePixelRatio;
    if (px > buddy.x - 2 * SCALE && px < buddy.x + 18 * SCALE && py > buddy.y - 2 * SCALE) {
      setAnim("excited");
      say(pokes[Math.floor(Math.random() * pokes.length)], 4);
      setTimeout(() => { if (buddy.anim === "excited") setAnim("idle"); }, 2000);
    }
  });

  function loop(t) {
    const a = anims[buddy.anim];
    if (t - buddy.lastFrame > 1000 / (a.fps || 4)) {
      buddy.lastFrame = t;
      buddy.frame++;
      if (buddy.frame >= a.frames.length) {
        if (a.loop === false) {
          buddy.frame = a.frames.length - 1;
          const done = buddy.oneShotDone;
          buddy.oneShotDone = null;
          if (done) done();
        } else {
          buddy.frame = 0;
        }
      }
    }
    if (buddy.target !== null) {
      const speed = SCALE * 0.6;
      const dx = buddy.target - buddy.x;
      if (Math.abs(dx) <= speed) {
        buddy.x = buddy.target; buddy.target = null;
        setAnim("idle");
      } else {
        buddy.x += Math.sign(dx) * speed;
      }
    }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#16161f";
    ctx.fillRect(0, FLOOR + 14 * SCALE, W, 2);
    if (buddy.present) {
      const f = anims[buddy.anim].frames.length;
      ctx.drawImage(frameCanvas(buddy.anim, Math.min(buddy.frame, f - 1), buddy.flip), buddy.x, buddy.y);
    }
    positionBubble();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__buddy = { buddy, say, arrive, anims };

  // ntfy SSE: buddy's own pushes carry title "buddy"; Pete's replies don't.
  function connect() {
    const es = new EventSource("https://ntfy.sh/" + topic + "/sse");
    es.onopen = () => statusEl.classList.add("on");
    es.onerror = () => statusEl.classList.remove("on");
    es.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.event !== "message" || m.title !== "buddy") return;
      console.log("[buddy] message:", m.message);
      if (buddy.present) say(m.message, 10);
      else arrive(m.message);
    };
  }
  connect();
})();
</script>
</body>
</html>
